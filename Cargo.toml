[package]
name = "minichain"
version = "0.2.0"
edition = "2021"
description = "A small educational blockchain: wallets, a UTXO ledger, proof-of-work and a toy peer-to-peer layer"

[dependencies]
bincode = "1.3"
bitcoincash-addr = "0.5"
clap = "4"
ed25519-dalek = "2"
env_logger = "0.10"
log = "0.4"
merkle-cbt = "0.3"
rand = "0.8"
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sled = "0.34"
